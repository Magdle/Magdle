<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-nav">
    <a class="home-link" href="/">← Retour à Magdle</a>
</div>

<h1>Classement de Neuillitude</h1>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Neuillitude</th>
            <th>Elo</th>
        </tr>
    </thead>
    <tbody id="scoreBody"></tbody>
</table>

<div class="back">
    <button onclick="window.location.href='index.html'">
        ⬅ Retour
    </button>
</div>

</body>

<script>
    const SCOREBOARD_API_URL = '/api/neuille/scoreboard';

    function renderTable(items) {
        const tbody = document.getElementById('scoreBody');
        tbody.innerHTML = '';

        items.forEach((item, index) => {
            const rank = index + 1;
            const tr = document.createElement('tr');

            if (rank === 1) tr.className = 'rank-1';
            else if (rank === 2) tr.className = 'rank-2';
            else if (rank === 3) tr.className = 'rank-3';

            tr.innerHTML = `
                <td>${rank}</td>
                <td>${item.name}</td>
                <td>${item.neuillitude}</td>
                <td>${item.elo}</td>
            `;

            tbody.appendChild(tr);
        });
    }

    async function init() {
        const response = await fetch(SCOREBOARD_API_URL, { cache: 'no-store' });
        if (!response.ok) {
            throw new Error('Erreur API joueurs');
        }
        const data = await response.json();
        renderTable(data);
    }

    init().catch(err => {
        console.error(err);
        alert('Erreur de chargement des donnees.');
    });
</script>

</html>
