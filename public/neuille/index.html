<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Neuille VS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-nav">
    <a class="home-link" href="/">← Retour à Magdle</a>
</div>

<h1>Qui est le plus neuille ?</h1>

<div class="container">
    <button id="btn1">
        <img id="img1" alt="Portrait 1">
        <div id="name1" class="name"></div>
    </button>

    <button id="btn2">
        <img id="img2" alt="Portrait 2">
        <div id="name2" class="name"></div>
    </button>
</div>

<div class="container">
    <div class="actions">
        <button id="btnDraw" class="secondary draw">
            Égalité
        </button>

        <button id="btnReroll" class="secondary">
            Sans avis
        </button>
    </div>
</div>
<div class="container">
    <button class="secondary" onclick="window.location.href='scoreboard.html'">
        Classement
    </button>
</div>

</body>

<script>
    const PLAYERS_API_URL = '/api/neuille/players';
    const VOTE_API_URL = '/api/neuille/vote';

    let data = [];
    let currentPair = null;

    function setImage(imgEl, imageId) {
        imgEl.dataset.fallback = '';
        imgEl.onerror = () => {
            if (!imgEl.dataset.fallback) {
                imgEl.dataset.fallback = '1';
                imgEl.src = `images/${imageId}.png`;
            }
        };
        imgEl.src = `images/${imageId}.jpg`;
    }

    function pickTwo(items, lastPair) {
        if (items.length < 2) return null;
        let attempt = 0;
        let item1, item2;
        do {
            const idx1 = Math.floor(Math.random() * items.length);
            let idx2 = Math.floor(Math.random() * items.length);
            while (idx2 === idx1) {
                idx2 = Math.floor(Math.random() * items.length);
            }
            item1 = items[idx1];
            item2 = items[idx2];
            attempt++;
        } while (
            lastPair &&
            ((item1.id === lastPair[0].id && item2.id === lastPair[1].id) ||
             (item1.id === lastPair[1].id && item2.id === lastPair[0].id)) &&
            attempt < 10
        );
        return [item1, item2];
    }

    function renderPair(pair) {
        if (!pair) return;
        currentPair = pair;

        const [item1, item2] = pair;
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');

        setImage(img1, item1.imageId);
        setImage(img2, item2.imageId);

        document.getElementById('name1').innerText = item1.name;
        document.getElementById('name2').innerText = item2.name;

        document.getElementById('btn1').onclick = () => vote(item1.id, item2.id, false).catch(handleVoteError);
        document.getElementById('btn2').onclick = () => vote(item2.id, item1.id, false).catch(handleVoteError);
        document.getElementById('btnDraw').onclick = () => vote(item1.id, item2.id, true).catch(handleVoteError);
    }

    function handleVoteError(err) {
        console.error(err);
        alert('Erreur lors du vote.');
    }

    function applyVoteResult(eloData) {
        const winner = data.find(item => item.id === eloData?.winner?.id);
        const loser = data.find(item => item.id === eloData?.loser?.id);
        if (winner && typeof eloData?.winner?.new_elo === 'number') {
            winner.elo = eloData.winner.new_elo;
        }
        if (loser && typeof eloData?.loser?.new_elo === 'number') {
            loser.elo = eloData.loser.new_elo;
        }
    }

    async function vote(idClicked, idOther, isDraw) {
        const response = await fetch(VOTE_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                idClicked,
                idOther,
                draw: isDraw
            })
        });

        const eloData = await response.json();
        if (!response.ok || eloData?.error) {
            throw new Error(eloData?.error || 'Erreur vote');
        }

        applyVoteResult(eloData);
        reroll();
    }

    function reroll() {
        const pair = pickTwo(data, currentPair);
        renderPair(pair);
    }

    async function init() {
        const response = await fetch(PLAYERS_API_URL, { cache: 'no-store' });
        if (!response.ok) {
            throw new Error('Erreur API joueurs');
        }
        data = await response.json();
        reroll();

        document.getElementById('btnReroll').onclick = () => reroll();
    }

    init().catch(err => {
        console.error(err);
        alert('Erreur de chargement des donnees.');
    });
</script>

</html>
